<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <title>To Do List</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script src="script.js" type="module"></script>
</head>

<body>
    <div class="todo">
        <h1 class="todo__title">To Do List</h1>
        <form class="todo__form">
            <div class="todo__field field">
                <label class="field__label" for="new-task">
                    New task
                </label>
                <input class="field__input" id="new-task" placeholder=" " autocomplete="off"
                    data-js-todo-new-task-input />
            </div>
            <button class="button" type="submit">Add</button>
        </form>
        <form class="todo__form">
            <div class="todo__field field">
                <label class="field__label" for="search-task">
                    Search task
                </label>
                <input class="field__input" id="search-task" placeholder=" " autocomplete="off" type="search" />
            </div>
        </form>
        <div class="todo__info">
            <div class="todo__total-tasks">
                Total tasks: <span>0</span>
            </div>
            <button class="todo__delete-all-button" type="button">
                Delete all
            </button>
        </div>
        <ul class="todo__list"></ul>
        <div class="todo__empty-message"></div>
    </div>
</body>

</html>
