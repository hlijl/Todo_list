<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>To do list</title>
    <link rel="stylesheet" href="/src/styles/index.css">
    <script src="/script.js" type="module"></script>
</head>

<body>
    <div class="todo">
        <h1 class="todo_title">To do list</h1>
        <form class="todo__form">
            <div class="todo__field field">
                <label class="field_label" for="new task">New task title</label>
                <input type="text" class="field__input" id="new_task" placeholder=" " autocomplete="off">
            </div>
            <button class="button" type="submit">Add</button>
        </form>
        <form class="todo__form">
            <div class="todo__field field">
                <label class="field_label" for="search task">Search task</label>
                <input type="search" class="field__input" id="search" placeholder=" " autocomplete="off">
            </div>
        </form>
        <div class="todo__info">
            <div class="todo__total_tasks">
                Total tasks: <span>0</span>
            </div>
            <button class="todo__delede-all-button" type="button">Delete All</button>
        </div>
        <ul class="todo__list">
            <li class="todo__item todo-item">
                <input type="text" class="todo-item__checkbox">
                <label class="todo-item__label" for="todo-1">Todo-1</label>
                <button class="todo-item__delete-button" type="button" aria-label="Delete" title="Delete">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </li>
            <li class="todo__item todo-item">
                <input type="text" class="todo-item__checkbox">
                <label class="todo-item__label" for="todo-1">Todo-1</label>
                <button class="todo-item__delete-button" type="button" aria-label="Delete" title="Delete">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </li>
            <li class="todo__item todo-item" todo__item__checkbox>
                <input type="text" class="todo-item__checkbox">
                <label class="todo-item__label" for="todo-1">Todo-1</label>
                <button class="todo-item__delete-button" type="button" aria-label="Delete" title="Delete">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </li>

        </ul>
    </div>
</body>

</html>
